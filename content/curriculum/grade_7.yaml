# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
subjects:

  # â”€â”€ MATHEMATICS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Aligned to: Ontario Grade 7 Â· BC Grade 7 Â· Alberta Grade 7
  #             CCSS Grade 7 (7.RP, 7.NS, 7.EE, 7.G, 7.SP)
  #
  # Grade 7 math progression vs Grade 6:
  #   ratios           â†’ proportional_reasoning (constant of proportionality,
  #                       percent change, tax/tip/discount)
  #   integers         â†’ rational_numbers (all ops with pos/neg fractions+decimals)
  #   linear_equations â†’ two_step_equations (also inequalities)
  #   geometry_area    â†’ geometry_circles (Ï€, circumference, area of circles)
  #   (new)            â†’ surface_area_and_volume (3D figures: prisms, cylinders)
  #   data_and_graphs  â†’ statistics_and_sampling (variability, sampling inference)
  #   probability      â†’ probability_compound (compound events, tree diagrams)
  - subject: mathematics
    display: Mathematics
    topics:

      - key: proportional_reasoning
        display: Proportional Reasoning
        order_index: 0      # suggested insert_arc.py TOPIC_ORDER value
        description: >
          Proportional relationships between two quantities. Unit rate and constant
          of proportionality. Identifying proportional vs non-proportional
          relationships from tables, graphs, and equations. Percent problems:
          percent of a number, percent increase/decrease, tax, tip, and discount.
          Real-world contexts (price comparison, recipe scaling, sales, sports stats).
        prerequisites: [ratios, percentages]   # Grade 6 keys
        estimated_sessions: 3
        curriculum_refs:
          canada: Ontario Grade 7 â€” Number Sense Â· Proportional Relationships
          quebec: PFEQ Secondary 1 â€” Arithmetic Â· Proportionality
          us: CCSS 7.RP â€” Ratios and Proportional Relationships
        arc_notes: >
          Hook: percent discount at a store or recipe scaling for a large party.
          Concept: constant of proportionality (k = y/x) and y = kx.
          Guided: simple unit rate and percent-of-a-number problems.
          Practice: tax + tip combined, percent change (before/after price).
          Capstone: multi-step percent word problem (e.g. original price after
          successive discount and tax).
        status:
          en: approved
          fr: approved

      - key: rational_numbers
        display: Rational Numbers
        order_index: 1
        description: >
          All four operations (add, subtract, multiply, divide) with positive and
          negative fractions and decimals. Absolute value. Order of operations with
          rational numbers. Real-world contexts (temperature change, money/debt,
          elevation, sports stats with negative scores).
        prerequisites: [integers, fractions]   # Grade 6 keys
        estimated_sessions: 3
        curriculum_refs:
          canada: Ontario Grade 7 â€” Number Sense Â· Operations with Fractions
          quebec: PFEQ Secondary 1 â€” Arithmetic Â· Operations on rational numbers
          us: CCSS 7.NS â€” The Number System
        arc_notes: >
          Hook: bank balance going negative, or temperature falling below zero
          by a fractional amount.
          Concept: negative fractions on the number line; multiplying two negatives
          gives positive.
          Guided: add/subtract negative fractions with unlike denominators.
          Practice: multiply and divide rational numbers; real-world word problems.
          Capstone: multi-operation expression with mixed positive and negative
          rational numbers (order of operations).
        status:
          en: approved
          fr: approved

      - key: two_step_equations
        display: Two-Step Equations and Inequalities
        order_index: 2
        description: >
          Solving two-step linear equations (ax + b = c). Writing equations from
          word problems. Checking solutions. Introduction to inequalities â€” solving
          and graphing on a number line. Real-world contexts (age problems, price
          problems, distance/rate/time).
        prerequisites: [linear_equations]   # Grade 6 key
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Grade 7 â€” Patterning and Algebra
          quebec: PFEQ Secondary 1 â€” Algebra Â· Equations and inequalities
          us: CCSS 7.EE â€” Expressions and Equations
        arc_notes: >
          Hook: "I'm thinking of a number..." riddle that requires two-step
          solving; or a cell-phone plan cost equation.
          Concept: inverse operations applied twice; equality rule (do same to
          both sides).
          Guided: simple ax + b = c problems with small integers.
          Practice: word problems requiring writing the equation first;
          inequality problems with direction of inequality flip for negatives.
          Capstone: age-gap or distance word problem requiring inequality + check.
        status:
          en: approved
          fr: approved

      - key: geometry_circles
        display: Circles â€” Circumference and Area
        order_index: 3
        description: >
          Parts of a circle (radius, diameter, chord, arc). The number Ï€ and where
          it comes from. Circumference formula (C = Ï€d = 2Ï€r). Area of a circle
          (A = Ï€rÂ²). Composite figures involving circles and rectangles/triangles.
          Real-world contexts (wheels, pipes, pizza, tracks, clocks).
        prerequisites: [geometry_area_perimeter]   # Grade 6 key
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Grade 7 â€” Measurement Â· Circles
          quebec: PFEQ Secondary 1 â€” Geometry Â· Circles
          us: CCSS 7.G.4-6 â€” Area and circumference of circles
        arc_notes: >
          Hook: comparing circular pizza sizes (is a 14-inch much bigger than 12-inch?).
          Concept: Ï€ as the ratio of circumference to diameter â€” always â‰ˆ3.14159;
          derive C = Ï€d from this.
          Guided: find circumference given diameter; find area given radius.
          Practice: find radius given circumference; composite shapes (semi-circle +
          rectangle).
          Capstone: running track problem (rectangle + two semi-circles); compare
          areas of two differently-sized circles.
        status:
          en: approved
          fr: approved

      - key: surface_area_and_volume
        display: Surface Area and Volume
        order_index: 4
        description: >
          Surface area of rectangular prisms, triangular prisms, and cylinders
          (using nets). Volume of prisms, pyramids, and cylinders. Relationship
          between volume and capacity. Real-world contexts (packaging, aquariums,
          paint coverage, storage containers).
        prerequisites: [geometry_area_perimeter, geometry_circles]
        estimated_sessions: 3
        curriculum_refs:
          canada: Ontario Grade 7 â€” Measurement Â· 3D Figures
          quebec: PFEQ Secondary 1 â€” Geometry Â· Solids
          us: CCSS 7.G.6 â€” Surface area and volume of 3D figures
        arc_notes: >
          Hook: designing a box to ship a gift â€” how much cardboard is needed
          (surface area) and will the item fit (volume)?
          Concept: net of a rectangular prism â†’ 6 rectangle faces; surface area
          = sum of all face areas.
          Guided: surface area of a rectangular prism; volume of a rectangular
          prism (V = l Ã— w Ã— h).
          Practice: surface area of a triangular prism; volume of a cylinder.
          Capstone: compare two container designs â€” which uses less material
          (surface area) for the same volume?
        status:
          en: approved
          fr: approved

      - key: statistics_and_sampling
        display: Statistics and Sampling
        order_index: 5
        description: >
          Random sampling and why it gives valid inferences. Comparing two data
          sets using measures of centre (mean, median) and spread (range, IQR,
          MAD). Box-and-whisker plots. Drawing conclusions from data. Real-world
          contexts (survey results, sports analytics, health data, opinion polls).
        prerequisites: [data_and_graphs]   # Grade 6 key
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Grade 7 â€” Data Management
          quebec: PFEQ Secondary 1 â€” Statistics Â· Measures of dispersion
          us: CCSS 7.SP.1-4 â€” Statistics and Probability
        arc_notes: >
          Hook: two hockey teams â€” who is more consistent? (compare distributions,
          not just averages).
          Concept: random sample vs biased sample; IQR as measure of spread.
          Guided: calculate mean and MAD for a small data set; identify outlier.
          Practice: compare two box plots; determine which team is "better" based
          on median and IQR.
          Capstone: given a biased survey description, explain why inference would
          be unreliable and suggest how to fix the sampling method.
        status:
          en: approved
          fr: approved

      - key: probability_compound
        display: Compound Probability
        order_index: 6
        description: >
          Review: simple probability as a fraction 0â€“1. Compound events â€”
          independent and dependent. Counting outcomes: tree diagrams, organized
          lists, and the Fundamental Counting Principle. Theoretical vs
          experimental probability. Real-world contexts (board games, card games,
          lotteries, weather forecasts).
        prerequisites: [probability]   # Grade 6 key
        estimated_sessions: 2
        review_note: >
          US CCSS 7.SP.5-8 covers compound probability at Grade 7. Canadian
          provincial curricula vary â€” Ontario places compound probability in
          Grade 7 Data Management unit. Include for all markets.
        curriculum_refs:
          canada: Ontario Grade 7 â€” Data Management and Probability
          quebec: PFEQ Secondary 1 â€” Statistics and Probability
          us: CCSS 7.SP.5-8 â€” Probability
        arc_notes: >
          Hook: card game where you draw two cards â€” what are the chances of
          getting two aces?
          Concept: compound event = two or more simple events; independent events
          â†’ P(A and B) = P(A) Ã— P(B).
          Guided: tree diagram for flipping a coin twice; count outcomes.
          Practice: draw without replacement (dependent); organized list for
          rolling two dice.
          Capstone: design a "fair game" using compound probability, justify why
          it is or isn't fair using calculations.
        status:
          en: approved
          fr: approved

  # â”€â”€ SCIENCE â€” PHYSICS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Aligned to: Ontario Science Grade 7 Â· NGSS MS-PS (Middle School Physical Science)
  #             NGSS MS-ESS (Earth and Space Science)
  - subject: physics
    display: Science â€” Physics
    subject_group: science
    topics:

      - key: heat_and_thermal_energy
        display: Heat and Thermal Energy
        order_index: 0
        description: >
          Difference between temperature and thermal energy. Heat transfer:
          conduction, convection, and radiation with everyday examples.
          Thermal insulators and conductors. Thermal expansion. Real-world
          contexts (cooking, weather systems, home insulation, car engines,
          thermometers).
        prerequisites: []
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Heat in the Environment
          quebec: PFEQ Secondary 1 â€” Earth and Space Â· Thermal energy
          us: NGSS MS-PS3-3/4 â€” Energy Â· Thermal energy transfer
        arc_notes: >
          Hook: why does a metal spoon in hot soup get burning-hot while a
          wooden spoon handle stays cool? (conduction + insulators).
          Concept: three heat transfer methods with clear diagrams; temperature
          measures average kinetic energy of particles.
          Guided: identify conduction/convection/radiation in given scenarios.
          Practice: rank insulators by effectiveness; explain why a thermos
          works.
          Capstone: design challenge â€” choose materials to build the best
          insulated container; justify using all three transfer concepts.
        status:
          en: approved
          fr: approved

      - key: the_solar_system
        display: The Solar System
        order_index: 1
        description: >
          The Sun and eight planets â€” order, relative size, and distance.
          Why planets orbit the Sun (gravity). Moon phases and why they occur.
          Tides â€” gravitational pull of Moon on Earth's oceans. Solar and lunar
          eclipses. Real-world contexts (seasons, navigation, space exploration,
          the night sky in Canada).
        prerequisites: []
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Earth and Space Systems
          quebec: PFEQ Secondary 1 â€” Earth and Space Â· Solar System
          us: NGSS MS-ESS1-1/2/3 â€” Earth's Place in the Universe
        arc_notes: >
          Hook: why did it get dark in the middle of the day? (solar eclipse)
          â€” a news story from a city in the eclipse path.
          Concept: planets in order, Moon orbit causes phases, eclipse geometry
          (Earth/Moon/Sun alignment).
          Guided: moon phase sequence (new â†’ crescent â†’ quarter â†’ gibbous â†’
          full â†’ back); identify solar vs lunar eclipse from diagram.
          Practice: explain why we always see the same side of the Moon;
          explain why tides are highest during full/new moon.
          Capstone: given a diagram of Earth-Moon-Sun positions, predict:
          (a) what phase is the moon? (b) could an eclipse happen? Justify.
        status:
          en: approved
          fr: approved

      - key: energy_and_work
        display: Energy and Work
        order_index: 2
        description: >
          Kinetic energy (energy of motion) and potential energy (stored energy).
          Gravitational potential energy. Energy transformations between KE and PE.
          Work as force applied through a distance (W = F Ã— d). Conservation of
          energy (energy cannot be created or destroyed). Real-world contexts
          (roller coasters, pendulums, hydroelectric dams, sports).
        prerequisites: [forces_and_motion]   # Grade 6 key
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Structures and Mechanisms
          quebec: PFEQ Secondary 1 â€” Physical world Â· Forms of energy
          us: NGSS MS-PS3-1/2/5 â€” Energy
        arc_notes: >
          Hook: roller coaster â€” at the top of the first hill, nearly stopped;
          at the bottom, moving fastest. Where did the energy come from?
          Concept: PE = mgh (conceptual, not formula-heavy); KE = Â½mvÂ² (describe
          relationship); at top â†’ max PE, at bottom â†’ max KE.
          Guided: identify energy type at each point of a pendulum swing;
          calculate simple work (W = F Ã— d).
          Practice: compare two roller coasters; predict speed at bottom given
          height.
          Capstone: hydroelectric dam â€” trace energy transformation from water
          height (PE) â†’ falling water (KE) â†’ generator â†’ electricity; explain
          why no energy is "lost" but some is "converted" to heat.
        status:
          en: approved
          fr: approved

  # â”€â”€ SCIENCE â€” CHEMISTRY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Aligned to: Ontario Science Grade 7 Â· NGSS MS-PS1 (Matter and Its Interactions)
  - subject: chemistry
    display: Science â€” Chemistry
    subject_group: science
    topics:

      - key: atoms_and_elements
        display: Atoms and Elements
        order_index: 0
        description: >
          The atom as the smallest unit of an element. Protons, neutrons, and
          electrons â€” their charge and location. Elements vs compounds vs mixtures.
          The periodic table â€” how it's organized, what periods and groups mean.
          Introduction to chemical symbols and simple formulas (Hâ‚‚O, COâ‚‚, NaCl).
          Real-world contexts (the materials everything is made of, why gold is
          gold, why water is special).
        prerequisites: [matter_and_materials, physical_vs_chemical_changes]   # Grade 6
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Pure Substances and Mixtures
          quebec: PFEQ Secondary 1 â€” Material world Â· Atom model
          us: NGSS MS-PS1-1 â€” Properties and structure of matter
        arc_notes: >
          Hook: why does a copper penny turn green outdoors but gold jewellery
          never changes? (different elements behave differently).
          Concept: atom structure; element = one type of atom; compound = atoms
          bonded together in a fixed ratio; periodic table organization.
          Guided: identify element vs compound from formula; locate element on
          periodic table and state its period and group.
          Practice: write the number of each atom in a compound formula;
          explain difference between element, compound, and mixture.
          Capstone: given description of a substance, classify it as element,
          compound, or mixture AND justify using particle-level reasoning.
        status:
          en: approved
          fr: approved

      - key: acids_and_bases
        display: Acids and Bases
        order_index: 1
        description: >
          The pH scale (0â€“14). Properties of acids (sour taste, corrosive,
          pH < 7) and bases (bitter/slippery, pH > 7). Neutral substances (pH = 7).
          Indicators â€” litmus, pH paper, red cabbage juice. Neutralization reaction.
          Real-world examples (stomach acid, baking soda, cleaning products,
          rainwater, vinegar, pool water maintenance).
        prerequisites: [atoms_and_elements, physical_vs_chemical_changes]
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Pure Substances and Mixtures
          quebec: PFEQ Secondary 1 â€” Material world Â· Acid-base reactions
          us: NGSS MS-PS1-2 â€” Chemical reactions (acid-base as example)
        arc_notes: >
          Hook: why does vinegar and baking soda make bubbles when mixed? Is
          that a chemical change?
          Concept: pH scale â€” below 7 = acid, above 7 = base, 7 = neutral;
          neutralization produces water and a salt.
          Guided: classify common substances (lemon juice, bleach, pure water,
          milk) by pH range; identify indicator colour change.
          Practice: neutralization word problem â€” how much base to neutralize
          an acid?; real-world pH safety scenario.
          Capstone: pool maintenance problem â€” pH is too low, which common
          household substance could raise it, and what would happen at particle
          level?
        status:
          en: approved
          fr: approved

  # â”€â”€ SCIENCE â€” BIOLOGY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Aligned to: Ontario Science Grade 7 Â· NGSS MS-LS (Middle School Life Science)
  - subject: biology
    display: Science â€” Biology
    subject_group: science
    topics:

      - key: diversity_of_living_things
        display: Diversity of Living Things
        order_index: 0
        description: >
          Classification system (Domain â†’ Kingdom â†’ Phylum â†’ Class â†’ Order â†’
          Family â†’ Genus â†’ Species). Characteristics of the five kingdoms
          (Monera/bacteria, Protista, Fungi, Plantae, Animalia). Binomial
          nomenclature. Dichotomous keys. Real-world contexts (identifying local
          wildlife, understanding disease-causing organisms, biodiversity).
        prerequisites: [cells_and_life]   # Grade 6 key
        estimated_sessions: 2
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Diversity of Living Things
          quebec: PFEQ Secondary 1 â€” Living world Â· Classification
          us: NGSS MS-LS4-2 â€” Biological evolution and diversity
        arc_notes: >
          Hook: you find a strange organism in a pond â€” how would a scientist
          decide what it is? (dichotomous key exercise).
          Concept: classification hierarchy with a memorable mnemonic; key
          differences between kingdoms (unicellular/multicellular, cell wall,
          autotroph/heterotroph).
          Guided: classify given organisms; use a simplified dichotomous key.
          Practice: explain why a mushroom is a Fungus, not a Plant; identify
          kingdom from a description.
          Capstone: given three mystery organisms with listed characteristics,
          use classification criteria to place each in the correct kingdom and
          justify your reasoning.
        status:
          en: approved
          fr: approved

      - key: cell_division_and_growth
        display: Cell Division and Growth
        order_index: 1
        description: >
          Why cells divide (growth, repair, reproduction). Mitosis overview â€”
          four stages (prophase, metaphase, anaphase, telophase) in accessible
          terms. DNA as the instruction manual copied into each new cell.
          Cell differentiation â€” how one fertilized egg becomes a whole body.
          Real-world contexts (wound healing, cancer as uncontrolled division,
          how babies grow).
        prerequisites: [cells_and_life]   # Grade 6 key
        estimated_sessions: 2
        review_note: >
          Keep mitosis at a conceptual level (stage names + what happens).
          Do NOT include meiosis or reproduction â€” outside Nova MVP scope for
          this age group. Cancer reference should be factual and non-scary.
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Cells
          quebec: PFEQ Secondary 1 â€” Living world Â· Cell division
          us: NGSS MS-LS1-2 â€” Cell division and growth
        arc_notes: >
          Hook: you cut your finger â€” how does skin repair itself? The answer
          is in cell division.
          Concept: 4 stages of mitosis as a story (chromosomes line up, pull
          apart, cell splits into two identical daughter cells).
          Guided: sequence the four mitosis stages; identify what happens at
          each stage.
          Practice: explain why each daughter cell has the same DNA as the
          parent; explain one consequence of cell division going wrong.
          Capstone: compare how mitosis serves growth (adding new cells) vs
          repair (replacing damaged cells); explain why cancer is a cell
          division problem, not a disease you "catch."
        status:
          en: approved
          fr: approved

      - key: heredity_and_traits
        display: Heredity and Traits
        order_index: 2
        description: >
          Genes as segments of DNA that determine traits. Dominant and recessive
          alleles. Homozygous and heterozygous genotypes. Phenotype vs genotype.
          Punnett squares for one trait (monohybrid cross). Inherited vs
          environmental traits. Real-world contexts (eye colour, tongue rolling,
          agricultural breeding, genetic diseases at introductory level).
        prerequisites: [cell_division_and_growth]
        estimated_sessions: 2
        review_note: >
          Punnett squares are the primary skill for this arc. Keep genetic
          disease examples factual and non-alarmist (e.g. colour blindness
          is a safe example). Do NOT include sex-linked traits or complex
          inheritance â€” Grade 9+ content.
        curriculum_refs:
          canada: Ontario Science Grade 7 â€” Reproduction
          quebec: PFEQ Secondary 1 â€” Living world Â· Heredity
          us: NGSS MS-LS3-2 â€” Heredity â€” Inheritance and Variation
