#               Add via curriculum/regions/canada/grade_6_history.yaml etc.
# geography:    Same reason as history.
# arts:         Not suitable for voice-first Socratic tutoring in MVP.
# language_arts: Requires different arc structure (reading comprehension,
#               writing feedback). Immersion model — future phase.
# french_lang:  Separate immersion arc structure needed. Not Grade 6 priority.
#
